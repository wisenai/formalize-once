[project]
name = "symbol-scramble"
version = "0.1.0"
description = "Neuro-symbolic robustness vs. test-time scaling on perturbed medical calculation (MedCalc-Bench)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sscramble = "symbol_scramble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbol_scramble"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
